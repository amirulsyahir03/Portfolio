<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin Portfolio</title>
<style>
:root{--biru:#031273;--gelap:#020a45;--muda:#e8ecf9;--emas:#c9a24b;--garis:#d5dbee;--senyap:#5a6280}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f6f8fd;color:#13193a;line-height:1.5}
header{background:var(--gelap);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;align-items:center}
header a,header button{color:#fff;font-size:.9rem}
main{max-width:640px;margin:0 auto;padding:24px 5vw 60px}
h1{font-size:1.1rem;margin:0}
h2{color:var(--biru);font-size:1.2rem;margin:28px 0 12px}
.kotak{background:#fff;border:1px solid var(--garis);border-radius:10px;padding:20px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #b9c1de;border-radius:8px;background:#fff}
textarea{min-height:90px}
button.utama{margin-top:20px;width:100%;background:var(--biru);color:#fff;border:0;border-radius:8px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
button.utama:disabled{opacity:.6}
header button{background:none;border:1px solid #ffffff66;border-radius:6px;padding:6px 12px;cursor:pointer}
:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.mesej{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:.92rem}
.ok{background:#e3f4e8;color:#14532d}.ralat{background:#fde8e8;color:#7f1d1d}
.senarai div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--garis)}
.senarai small{color:var(--senyap);display:block}
.senarai button{background:#fff;color:#b91c1c;border:1px solid #e5b4b4;border-radius:6px;padding:6px 12px;cursor:pointer;flex-shrink:0}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Admin Portfolio</h1><div><a href="index.html">Lihat laman</a> <button id="keluar" class="hidden">Log keluar</button></div></header>
<main>

<div id="loginBox" class="kotak hidden">
  <h2 style="margin-top:0">Log masuk</h2>
  <label for="emel">E-mel</label><input id="emel" type="email" autocomplete="username">
  <label for="kata">Kata laluan</label><input id="kata" type="password" autocomplete="current-password">
  <button class="utama" id="masuk">Log masuk</button>
  <div id="loginMsg"></div>
</div>

<div id="panel" class="hidden">
  <div class="kotak">
    <h2 style="margin-top:0">Tambah entri baharu</h2>
    <label for="kategori">Kategori</label>
    <select id="kategori">
      <option value="kursus">Kursus disertai</option>
      <option value="sijil">Sijil &amp; kelayakan</option>
      <option value="badge">Badge</option>
      <option value="bengkel">Bengkel dikendalikan</option>
      <option value="anugerah">Anugerah</option>
      <option value="sumbangan">Sumbangan lain</option>
      <option value="kerjaya">Sejarah perkhidmatan</option>
    </select>
    <label for="tarikh">Tarikh / tahun</label><input id="tarikh" placeholder="cth: Mac 2026">
    <label for="tajuk">Tajuk</label><input id="tajuk" placeholder="cth: Kursus Pengajaran Digital">
    <label for="butiran">Penganjur / butiran</label><textarea id="butiran" placeholder="cth: Bahagian Pendidikan Guru, KPM"></textarea>
    <label for="fail">Gambar atau sijil (pilihan)</label>
    <input id="fail" type="file" accept="image/*,application/pdf">
    <button class="utama" id="simpan">Simpan</button>
    <div id="msg"></div>
  </div>

  <h2>Entri sedia ada</h2>
  <div class="kotak senarai" id="senarai"></div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "";   // "https://ixrwqticesnbtlfydarv.supabase.co"
const SUPABASE_KEY = "";   // "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4cndxdGljZXNuYnRsZnlkYXJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDkwNDEsImV4cCI6MjEwNzQyNTA0MX0.TgEVXZ2x4zpk-TJSbwWkXNHT9FfG5tvB6rDvUnhXO9M"

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAMA = {kerjaya:"Sejarah perkhidmatan", kursus:"Kursus", sijil:"Sijil", badge:"Badge", bengkel:"Bengkel", anugerah:"Anugerah", sumbangan:"Sumbangan"};
const db = (SUPABASE_URL && SUPABASE_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const tunjuk = (id, teks, jenis) => { $(id).innerHTML = teks ? `<div class="mesej ${jenis}">${esc(teks)}</div>` : ""; };

function kecil(file) {
  return new Promise(res => {
    if (!file.type.startsWith("image/")) return res(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), "image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

async function semak() {
  if (!db) { $("loginBox").classList.remove("hidden"); tunjuk("loginMsg", "Sambungan Supabase belum diisi dalam admin.html.", "ralat"); return; }
  const { data } = await db.auth.getSession();
  const masuk = !!data.session;
  $("loginBox").classList.toggle("hidden", masuk);
  $("panel").classList.toggle("hidden", !masuk);
  $("keluar").classList.toggle("hidden", !masuk);
  if (masuk) senarai();
}

$("masuk").onclick = async () => {
  tunjuk("loginMsg", "");
  const { error } = await db.auth.signInWithPassword({ email: $("emel").value.trim(), password: $("kata").value });
  if (error) return tunjuk("loginMsg", "E-mel atau kata laluan tidak betul.", "ralat");
  semak();
};
$("keluar").onclick = async () => { await db.auth.signOut(); semak(); };

$("simpan").onclick = async () => {
  const tajuk = $("tajuk").value.trim();
  if (!tajuk) return tunjuk("msg", "Sila isi tajuk.", "ralat");
  const btn = $("simpan"); btn.disabled = true; tunjuk("msg", "Sedang menyimpan…", "ok");
  try {
    let fail_url = null;
    const f = $("fail").files[0];
    if (f) {
      const blob = await kecil(f);
      const ext = blob.type === "image/jpeg" ? "jpg" : (f.name.split(".").pop() || "bin").toLowerCase();
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const up = await db.storage.from("fail").upload(path, blob, { contentType: blob.type || f.type });
      if (up.error) throw up.error;
      fail_url = db.storage.from("fail").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await db.from("entri").insert({
      kategori: $("kategori").value, tarikh: $("tarikh").value.trim(),
      tajuk, butiran: $("butiran").value.trim(), fail_url
    });
    if (error) throw error;
    ["tarikh", "tajuk", "butiran", "fail"].forEach(i => $(i).value = "");
    tunjuk("msg", "Berjaya disimpan. Entri sudah muncul di portfolio.", "ok");
    senarai();
  } catch (e) {
    tunjuk("msg", "Gagal menyimpan: " + (e.message || e), "ralat");
  }
  btn.disabled = false;
};

async function senarai() {
  const { data, error } = await db.from("entri").select("*").order("created_at", { ascending: false });
  if (error) return $("senarai").textContent = "Gagal memuatkan senarai.";
  $("senarai").innerHTML = data.length ? data.map(r =>
    `<div><span><small>${esc(NAMA[r.kategori] || r.kategori)} · ${esc(r.tarikh)}</small>${esc(r.tajuk)}</span><button data-id="${r.id}" data-fail="${esc(r.fail_url || "")}">Padam</button></div>`
  ).join("") : "<p>Belum ada entri.</p>";
}

$("senarai").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (!confirm("Padam entri ini?")) return;
  const fail = b.dataset.fail;
  if (fail.includes("/fail/")) await db.storage.from("fail").remove([fail.split("/fail/")[1].split("?")[0]]);
  await db.from("entri").delete().eq("id", b.dataset.id);
  senarai();
};

semak();
</script>
</body>
</html>
